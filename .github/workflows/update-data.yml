name: Update auction data

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run tests
        run: python3 -m unittest discover -s tools

      - name: Fetch auction list
        run: python3 tools/fetch_auctions.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/auctions.json; then
            echo "No data change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auctions.json
          git commit -m "data: update auction list"
          git pull --rebase
          git push
